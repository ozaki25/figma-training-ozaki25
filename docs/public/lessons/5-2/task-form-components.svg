<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="TextFieldコンポーネント、Buttonコンポーネント（primary/secondaryバリアント）、そして5-1のform-cardにインスタンスを入れ替えた完成イメージの3つを並べた図。TextFieldはラベルと入力欄の縦Auto Layout。Buttonは高さ44・角丸8で、primaryは紫背景に白文字、secondaryは白背景・紫枠線・紫文字。完成イメージではタスク名・期限・メモの3つのTextFieldと、登録ボタン（primary）がform-cardに縦に並ぶ。">
  <rect x="0" y="0" width="900" height="640" rx="12" fill="#F3F0FA"/>

  <text x="40" y="36" font-size="15" font-weight="bold" fill="#3B3355">TextField・Button コンポーネント</text>
  <text x="40" y="56" font-size="12" fill="#5A5273">紫の破線＝コンポーネントセット（バリアントをまとめる枠）</text>

  <!-- TextField component -->
  <rect x="40" y="80" width="230" height="120" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="52" y="102" font-size="12" font-weight="bold" fill="#7C3AED">TextField</text>
  <text x="52" y="120" font-size="11" fill="#8A8A93">ラベル</text>
  <rect x="52" y="128" width="206" height="34" rx="4" fill="#FCFCFD" stroke="#D9D9E0" stroke-width="1"/>
  <text x="62" y="150" font-size="12" fill="#1A1A1F">入力欄</text>
  <text x="52" y="184" font-size="11" fill="#5A5273">縦Auto Layout・gap 8</text>

  <!-- Button ComponentSet: variants -->
  <rect x="300" y="80" width="290" height="200" rx="8" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="312" y="102" font-size="12" font-weight="bold" fill="#7C3AED">Button（コンポーネントセット）</text>

  <!-- primary variant -->
  <rect x="316" y="118" width="258" height="60" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="328" y="136" font-size="11" fill="#7C3AED">variant = primary</text>
  <rect x="328" y="144" width="234" height="26" rx="6" fill="#7C3AED"/>
  <text x="445" y="162" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">登録</text>

  <!-- secondary variant -->
  <rect x="316" y="188" width="258" height="60" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="328" y="206" font-size="11" fill="#7C3AED">variant = secondary</text>
  <rect x="328" y="214" width="234" height="26" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="445" y="232" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">キャンセル</text>

  <text x="300" y="270" font-size="11" fill="#5A5273">プロパティ variant で2バリアントを切り替え</text>

  <!-- 完成イメージ（form-card with instances） -->
  <text x="620" y="102" font-size="13" font-weight="bold" fill="#3B3355">form-card（インスタンス配置後）</text>
  <rect x="620" y="118" width="240" height="380" rx="8" fill="#FFFFFF" stroke="#E2DDF0" stroke-width="1"/>
  <text x="636" y="146" font-size="14" font-weight="bold" fill="#1A1A1F">新しいタスク</text>

  <!-- TextField instance 1 -->
  <text x="636" y="172" font-size="11" fill="#8A8A93">タスク名</text>
  <rect x="636" y="180" width="208" height="32" rx="4" fill="#FCFCFD" stroke="#D9D9E0" stroke-width="1"/>
  <!-- TextField instance 2 -->
  <text x="636" y="234" font-size="11" fill="#8A8A93">期限</text>
  <rect x="636" y="242" width="208" height="32" rx="4" fill="#FCFCFD" stroke="#D9D9E0" stroke-width="1"/>
  <!-- TextField instance 3 -->
  <text x="636" y="296" font-size="11" fill="#8A8A93">メモ</text>
  <rect x="636" y="304" width="208" height="32" rx="4" fill="#FCFCFD" stroke="#D9D9E0" stroke-width="1"/>

  <!-- Button instance (primary) -->
  <rect x="636" y="356" width="208" height="36" rx="6" fill="#7C3AED"/>
  <text x="740" y="380" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">登録</text>

  <text x="636" y="418" font-size="11" fill="#5A5273">TextField × 3（幅Fill）</text>
  <text x="636" y="435" font-size="11" fill="#5A5273">Button × 1（variant=primary、幅Fill）</text>
  <text x="636" y="452" font-size="11" fill="#5A5273">form-cardの中身をインスタンスで置き換える</text>

  <!-- Arrows -->
  <path d="M 275 140 H 300" stroke="#7C3AED" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 595 178 H 620" stroke="#7C3AED" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Legend / notes -->
  <text x="40" y="320" font-size="13" font-weight="bold" fill="#3B3355">TextField 仕様</text>
  <text x="40" y="340" font-size="12" fill="#5A5273">・ラベル 12px（text/sub）</text>
  <text x="40" y="358" font-size="12" fill="#5A5273">・input 高さ44、padding 12、角丸8</text>
  <text x="40" y="376" font-size="12" fill="#5A5273">・枠線 #D9D9E0、テキスト 14px</text>
  <text x="40" y="394" font-size="12" fill="#5A5273">・原本は幅Fixed、フォーム内でFillにする</text>

  <text x="300" y="320" font-size="13" font-weight="bold" fill="#3B3355">Button 仕様</text>
  <text x="300" y="340" font-size="12" fill="#5A5273">・高さ44、padding H 20、角丸8</text>
  <text x="300" y="358" font-size="12" fill="#5A5273">・テキスト 14px SemiBold</text>
  <text x="300" y="376" font-size="12" fill="#5A5273">・primary: 背景brand・白文字</text>
  <text x="300" y="394" font-size="12" fill="#5A5273">・secondary: 白背景・brand枠線と文字</text>

  <text x="40" y="440" font-size="13" font-weight="bold" fill="#3B3355">3-2で学んだバリアントを本番で使う</text>
  <text x="40" y="460" font-size="12" fill="#5A5273">登録フォームで使うのは primary だけだが、後で「キャンセル」を並べたくなった時のために</text>
  <text x="40" y="478" font-size="12" fill="#5A5273">2バリアントで作っておく。切り替えはインスタンスのドロップダウンだけで済む。</text>

  <text x="40" y="520" font-size="13" font-weight="bold" fill="#3B3355">5-1で置いたプレースホルダーとの置き換え</text>
  <text x="40" y="540" font-size="12" fill="#5A5273">・input-placeholder × 3 → TextField インスタンス（タスク名／期限／メモ）</text>
  <text x="40" y="558" font-size="12" fill="#5A5273">・button-placeholder → Button インスタンス（variant=primary、テキスト「登録」）</text>
  <text x="40" y="576" font-size="12" fill="#5A5273">原本は5-1と同じく画面フレームの外に置き、フォームにはインスタンスだけ並べる。</text>
</svg>
