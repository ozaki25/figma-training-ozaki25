<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="Hug・Fixed・Fillの違い。同じ親フレームの中で、Hug contentsの要素は中身のテキストに合わせた幅に縮み、Fixedの要素は指定した数値の幅のまま、Fill containerの要素は親いっぱいの幅に広がる。">
  <!-- 背景（ライト/ダーク両モードで同じ見た目になるよう単色を持たせる） -->
  <rect x="0" y="0" width="860" height="400" rx="12" fill="#F3F0FA"/>

  <!-- 左: Hug contents -->
  <text x="158" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">Hug contents</text>
  <text x="158" y="76" text-anchor="middle" font-size="13" fill="#5A5273">中身が決める</text>

  <!-- 親フレーム -->
  <rect x="46" y="100" width="224" height="180" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1"/>
  <text x="58" y="122" font-size="11" fill="#5A5273">親フレーム</text>
  <!-- 子要素: 中身にぴったり -->
  <rect x="70" y="160" width="118" height="44" rx="8" fill="#A78BFA"/>
  <text x="129" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">テキスト</text>
  <!-- 幅ガイド -->
  <path d="M 70 224 v 8 M 188 224 v 8 M 70 228 H 188" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
  <text x="129" y="250" text-anchor="middle" font-size="12" fill="#7C3AED">中身と同じ幅</text>

  <text x="158" y="316" text-anchor="middle" font-size="13" fill="#5A5273">中身に合わせて縮む。</text>
  <text x="158" y="338" text-anchor="middle" font-size="13" fill="#5A5273">CSSの width: fit-content</text>

  <!-- 中央: Fixed -->
  <text x="430" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">Fixed</text>
  <text x="430" y="76" text-anchor="middle" font-size="13" fill="#5A5273">自分が決める</text>

  <rect x="318" y="100" width="224" height="180" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1"/>
  <text x="330" y="122" font-size="11" fill="#5A5273">親フレーム</text>
  <!-- 子要素: 固定幅（中身より広い） -->
  <rect x="342" y="160" width="160" height="44" rx="8" fill="#A78BFA"/>
  <text x="422" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">テキスト</text>
  <!-- 幅ガイド -->
  <path d="M 342 224 v 8 M 502 224 v 8 M 342 228 H 502" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
  <text x="422" y="250" text-anchor="middle" font-size="12" fill="#7C3AED">W: 160 で固定</text>

  <text x="430" y="316" text-anchor="middle" font-size="13" fill="#5A5273">指定した数値のまま変わらない。</text>
  <text x="430" y="338" text-anchor="middle" font-size="13" fill="#5A5273">CSSの width: 160px</text>

  <!-- 右: Fill container -->
  <text x="702" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">Fill container</text>
  <text x="702" y="76" text-anchor="middle" font-size="13" fill="#5A5273">親が決める</text>

  <rect x="590" y="100" width="224" height="180" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="602" y="122" font-size="11" fill="#5A5273">親フレーム（Auto Layout）</text>
  <!-- 子要素: 親いっぱい -->
  <rect x="606" y="160" width="192" height="44" rx="8" fill="#A78BFA"/>
  <text x="702" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">テキスト</text>
  <!-- 幅ガイド -->
  <path d="M 606 224 v 8 M 798 224 v 8 M 606 228 H 798" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
  <text x="702" y="250" text-anchor="middle" font-size="12" fill="#7C3AED">親いっぱいに広がる</text>

  <text x="702" y="316" text-anchor="middle" font-size="13" fill="#5A5273">親がAuto Layoutのときだけ選べる。</text>
  <text x="702" y="338" text-anchor="middle" font-size="13" fill="#5A5273">CSSの flex: 1</text>

  <!-- 下部の注記 -->
  <text x="430" y="378" text-anchor="middle" font-size="13" fill="#5A5273">設定は右サイドバーの W / H 入力欄のドロップダウンで、幅と高さを別々に選べる</text>
</svg>
