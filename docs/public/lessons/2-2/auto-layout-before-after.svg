<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="Auto Layout適用前と適用後の比較。適用前は円とテキストが目分量でばらばらに置かれている。適用後は名前と肩書きがgap 4の縦並び、それと円がgap 16の横並びにネストされ、padding 24のカードに整列している。">
  <!-- 背景（ライト/ダーク両モードで同じ見た目になるよう単色を持たせる） -->
  <rect x="0" y="0" width="860" height="480" rx="12" fill="#F3F0FA"/>

  <!-- 左: 適用前 -->
  <text x="218" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">適用前（目分量で配置）</text>

  <rect x="66" y="78" width="304" height="220" rx="16" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1"/>
  <!-- ばらばらに置かれた部品 -->
  <circle cx="140" cy="150" r="36" fill="#A78BFA"/>
  <text x="204" y="140" font-size="18" font-weight="bold" fill="#3B3355">山田太郎</text>
  <text x="196" y="178" font-size="13" fill="#5A5273">フロントエンドエンジニア</text>

  <text x="218" y="336" text-anchor="middle" font-size="13" fill="#5A5273">間隔も余白もばらばら。</text>
  <text x="218" y="358" text-anchor="middle" font-size="13" fill="#5A5273">要素を足すと全部手で置き直し</text>

  <!-- 中央の矢印 -->
  <path d="M 396 190 H 448 M 448 190 l -12 -9 M 448 190 l -12 9" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="422" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#7C3AED">Shift + A</text>

  <!-- 右: 適用後 -->
  <text x="628" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">適用後（Auto Layout）</text>

  <!-- カード（外側フレーム、padding 24） -->
  <rect x="476" y="78" width="304" height="220" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <!-- paddingの点線ガイド -->
  <rect x="500" y="102" width="256" height="172" fill="none" stroke="#C9C2DE" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 横並び: 円 + テキストグループ（gap 16） -->
  <circle cx="546" cy="188" r="36" fill="#A78BFA"/>
  <!-- 縦並びグループ（gap 4） -->
  <text x="608" y="176" font-size="18" font-weight="bold" fill="#3B3355">山田太郎</text>
  <text x="608" y="202" font-size="13" fill="#5A5273">フロントエンドエンジニア</text>

  <!-- 注記ライン: padding -->
  <path d="M 488 90 l 8 8" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="502" y="94" font-size="12" fill="#7C3AED">padding 24</text>

  <!-- 注記: gap 16（円とテキストの間） -->
  <path d="M 586 236 v 14" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="586" y="266" text-anchor="middle" font-size="12" fill="#7C3AED">gap 16</text>

  <!-- 注記: gap 4（名前と肩書きの間） -->
  <path d="M 736 184 h 14" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="754" y="188" font-size="12" fill="#7C3AED">gap 4</text>

  <text x="628" y="336" text-anchor="middle" font-size="13" fill="#5A5273">方向・間隔・余白をルールで管理。</text>
  <text x="628" y="358" text-anchor="middle" font-size="13" fill="#5A5273">要素を足しても自動で並び直る</text>

  <!-- 下部の構造注記 -->
  <text x="430" y="430" text-anchor="middle" font-size="13" fill="#5A5273">縦並び（名前＋肩書き）を横並び（円＋グループ）の中に入れるネスト構造</text>
</svg>
