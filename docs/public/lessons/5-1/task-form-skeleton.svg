<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="タスク登録フォーム画面の骨組みの見取り図。1440×1024のtask-formフレームの上部に高さ64のheaderがあり、左にアプリ名、右に戻る用のアイコンが入る。その下は薄グレーのcontentエリアで、中央に白いform-cardが置かれる。カードの中には見出しの新しいタスクと、入力欄のプレースホルダーが3つ、下部に登録ボタンのプレースホルダーが縦に並ぶ。入力欄とボタンは5-2で作る。">
  <!-- 背景（ライト/ダーク両モードで同じ見た目になるよう単色を持たせる） -->
  <rect x="0" y="0" width="900" height="620" rx="12" fill="#F3F0FA"/>

  <!-- フレーム全体のラベル -->
  <text x="40" y="40" font-size="15" font-weight="bold" fill="#3B3355">task-form（Desktop 1440×1024）</text>
  <text x="340" y="40" font-size="13" fill="#7C3AED">縦Auto Layout・gap 0</text>

  <!-- header内の要素ラベル（フレームの上に出す） -->
  <text x="52" y="76" font-size="12" fill="#7C3AED">app-title</text>
  <path d="M 76 82 V 100" stroke="#C9C2DE" stroke-width="1"/>
  <text x="560" y="76" font-size="12" fill="#7C3AED">back-icon</text>
  <path d="M 652 82 V 97" stroke="#C9C2DE" stroke-width="1"/>

  <!-- 画面フレーム（1440×1024を0.4375倍で表現） -->
  <rect x="40" y="90" width="630" height="448" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- header（高さ64 → 28） -->
  <line x1="40" y1="118" x2="670" y2="118" stroke="#E2DDF0" stroke-width="1"/>
  <text x="51" y="109" font-size="11" font-weight="bold" fill="#1A1A1F">My Tasks</text>
  <circle cx="652" cy="104" r="7" fill="#D9D9E0"/>

  <!-- content（薄グレー #F5F5F5） -->
  <rect x="41" y="118" width="628" height="419" fill="#F5F5F5"/>

  <!-- form-card（幅480→210、中央寄せ、角丸12→5） -->
  <rect x="250" y="146" width="210" height="228" rx="5" fill="#FFFFFF" stroke="#E2DDF0" stroke-width="1"/>

  <!-- form-title -->
  <text x="264" y="172" font-size="12" font-weight="bold" fill="#1A1A1F">新しいタスク</text>

  <!-- 入力欄プレースホルダー1（ラベル＋枠） -->
  <text x="264" y="192" font-size="9" fill="#8A8A93">タスク名</text>
  <rect x="264" y="197" width="182" height="18" rx="3" fill="#FCFCFD" stroke="#C9C2DE" stroke-width="1"/>
  <!-- 入力欄プレースホルダー2 -->
  <text x="264" y="230" font-size="9" fill="#8A8A93">期限</text>
  <rect x="264" y="235" width="182" height="18" rx="3" fill="#FCFCFD" stroke="#C9C2DE" stroke-width="1"/>
  <!-- 入力欄プレースホルダー3（メモ・やや高め） -->
  <text x="264" y="268" font-size="9" fill="#8A8A93">メモ</text>
  <rect x="264" y="273" width="182" height="30" rx="3" fill="#FCFCFD" stroke="#C9C2DE" stroke-width="1"/>

  <!-- ボタンプレースホルダー -->
  <rect x="264" y="325" width="182" height="22" rx="4" fill="#EDE7FA" stroke="#C9BEE8" stroke-width="1"/>
  <text x="355" y="339" font-size="10" fill="#7C3AED" text-anchor="middle">登録する</text>

  <!-- 右側の注記 -->
  <!-- header -->
  <path d="M 674 104 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="100" font-size="13" font-weight="bold" fill="#3B3355">header</text>
  <text x="706" y="117" font-size="12" fill="#5A5273">4章のtask-listと同じ構成</text>
  <text x="706" y="133" font-size="12" fill="#5A5273">幅Fill・高さFixed 64</text>

  <!-- form-card -->
  <path d="M 460 200 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="196" font-size="13" font-weight="bold" fill="#3B3355">form-card</text>
  <text x="706" y="213" font-size="12" fill="#5A5273">幅Fixed 480・中央寄せ</text>
  <text x="706" y="229" font-size="12" fill="#5A5273">縦Auto Layout・gap 20</text>
  <text x="706" y="245" font-size="12" fill="#5A5273">padding 32・角丸12・surface</text>

  <!-- form-title -->
  <path d="M 340 168 H 500 M 500 168 V 290 H 700" stroke="#C9C2DE" stroke-width="1" fill="none"/>
  <text x="706" y="287" font-size="13" font-weight="bold" fill="#3B3355">form-title</text>
  <text x="706" y="304" font-size="12" fill="#5A5273">「新しいタスク」page-title</text>

  <!-- placeholders -->
  <path d="M 460 300 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="344" font-size="13" font-weight="bold" fill="#3B3355">入力欄・ボタン</text>
  <text x="706" y="361" font-size="12" fill="#5A5273">いまはプレースホルダーの枠だけ</text>
  <text x="706" y="377" font-size="12" fill="#5A5273">（部品は5-2で作る）</text>

  <!-- content -->
  <path d="M 250 430 H 220 V 470 H 700" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
  <text x="706" y="466" font-size="13" font-weight="bold" fill="#3B3355">content</text>
  <text x="706" y="483" font-size="12" fill="#5A5273">幅Fill・高さFill・背景bg</text>
  <text x="706" y="499" font-size="12" fill="#5A5273">縦Auto Layout・整列を上中央</text>

  <!-- 下部の構造注記 -->
  <text x="40" y="572" font-size="13" fill="#5A5273">レイヤー構造: task-form の中に header と content。content の中に form-card。form-card の中に</text>
  <text x="40" y="593" font-size="13" fill="#5A5273">form-title と入力欄・ボタンのプレースホルダー。4章のタスク一覧と同じ部品・同じ手順で組み立てる。</text>
</svg>
