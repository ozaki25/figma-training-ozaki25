<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="タスク一覧画面の完成イメージ。task-listフレームの薄グレーのcontentエリアに、白いタスクカードのインスタンスが4枚縦に並ぶ。各カードは左にチェック用の正円、中央にタスク名、右端に期限。画面フレームの外にはメインコンポーネントのTaskCardが置かれている。">
  <!-- 背景（ライト/ダーク両モードで同じ見た目になるよう単色を持たせる） -->
  <rect x="0" y="0" width="900" height="620" rx="12" fill="#F3F0FA"/>

  <!-- フレーム全体のラベル -->
  <text x="40" y="40" font-size="15" font-weight="bold" fill="#3B3355">task-list（4-1で作った骨組み）</text>

  <!-- カード内要素のラベル（フレームの上に出す） -->
  <text x="52" y="76" font-size="12" fill="#7C3AED">checkbox 20×20</text>
  <path d="M 68 82 V 165" stroke="#C9C2DE" stroke-width="1"/>
  <text x="150" y="76" font-size="12" fill="#7C3AED">task-title 14px・幅Fill</text>
  <path d="M 190 82 V 165" stroke="#C9C2DE" stroke-width="1"/>
  <text x="520" y="76" font-size="12" fill="#7C3AED">task-due 12px・薄グレー</text>
  <path d="M 620 82 V 165" stroke="#C9C2DE" stroke-width="1"/>

  <!-- 画面フレーム（1440×1024を0.4375倍で表現） -->
  <rect x="40" y="90" width="630" height="448" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- header -->
  <line x1="40" y1="118" x2="670" y2="118" stroke="#E2DDF0" stroke-width="1"/>
  <text x="51" y="109" font-size="11" font-weight="bold" fill="#1A1A1F">My Tasks</text>
  <circle cx="652" cy="104" r="7" fill="#D9D9E0"/>

  <!-- content（薄グレー #F5F5F5） -->
  <rect x="41" y="118" width="628" height="419" fill="#F5F5F5"/>
  <!-- page-title -->
  <text x="54" y="145" font-size="13" font-weight="bold" fill="#1A1A1F">今日のタスク</text>

  <!-- TaskCardインスタンス4枚（高さ52 → 26、gap 16 → 7） -->
  <!-- カード1 -->
  <rect x="54" y="158" width="602" height="26" rx="4" fill="#FFFFFF"/>
  <circle cx="68" cy="171" r="4.5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="80" y="175" font-size="10" fill="#1A1A1F">デザインレビューの準備</text>
  <text x="644" y="174" font-size="9" fill="#8A8A93" text-anchor="end">7/3</text>
  <!-- カード2 -->
  <rect x="54" y="191" width="602" height="26" rx="4" fill="#FFFFFF"/>
  <circle cx="68" cy="204" r="4.5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="80" y="208" font-size="10" fill="#1A1A1F">会議資料の作成</text>
  <text x="644" y="207" font-size="9" fill="#8A8A93" text-anchor="end">7/4</text>
  <!-- カード3 -->
  <rect x="54" y="224" width="602" height="26" rx="4" fill="#FFFFFF"/>
  <circle cx="68" cy="237" r="4.5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="80" y="241" font-size="10" fill="#1A1A1F">APIエラーの調査</text>
  <text x="644" y="240" font-size="9" fill="#8A8A93" text-anchor="end">7/5</text>
  <!-- カード4（checkboxの塗りを上書きして完了扱い） -->
  <rect x="54" y="257" width="602" height="26" rx="4" fill="#FFFFFF"/>
  <circle cx="68" cy="270" r="4.5" fill="#7C3AED"/>
  <text x="80" y="274" font-size="10" fill="#1A1A1F">リリースノートの下書き</text>
  <text x="644" y="273" font-size="9" fill="#8A8A93" text-anchor="end">7/7</text>

  <!-- 右側の注記 -->
  <!-- インスタンス -->
  <path d="M 660 204 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="180" font-size="13" font-weight="bold" fill="#3B3355">TaskCard ×4</text>
  <text x="706" y="197" font-size="12" fill="#5A5273">（インスタンス）</text>
  <text x="706" y="214" font-size="12" fill="#5A5273">幅Fill・高さHug</text>
  <text x="706" y="230" font-size="12" fill="#5A5273">横Auto Layout・gap 12</text>
  <text x="706" y="246" font-size="12" fill="#5A5273">padding 16・上下中央</text>
  <text x="706" y="262" font-size="12" fill="#5A5273">背景白・角丸8</text>

  <!-- 完了カード -->
  <path d="M 660 270 H 700" stroke="#C9C2DE" stroke-width="1"/>
  <text x="706" y="292" font-size="12" fill="#5A5273">4枚目はcheckboxの塗りを</text>
  <text x="706" y="308" font-size="12" fill="#5A5273">上書きして完了を表現（任意）</text>

  <!-- メインコンポーネント（画面フレームの外） -->
  <rect x="40" y="562" width="300" height="30" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="none"/>
  <circle cx="58" cy="577" r="4.5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="70" y="581" font-size="10" fill="#1A1A1F">デザインレビューの準備</text>
  <text x="328" y="580" font-size="9" fill="#8A8A93" text-anchor="end">7/3</text>
  <path d="M 350 577 H 376" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="382" y="573" font-size="13" font-weight="bold" fill="#3B3355">TaskCard（メインコンポーネント）</text>
  <text x="382" y="590" font-size="12" fill="#5A5273">原本は画面フレームの外に置いたままにする</text>
</svg>
