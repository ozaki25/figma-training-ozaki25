<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="タスク一覧画面の骨組みの見取り図。1440×1024のtask-listフレームの上部に高さ64のheaderがあり、左にMy Tasks、右に丸いuser-iconが入る。その下は薄グレーのcontentエリアで、見出しの今日のタスクと、白い角丸のプレースホルダー四角形が3つ縦に並ぶ。">
  <!-- 背景（ライト/ダーク両モードで同じ見た目になるよう単色を持たせる） -->
  <rect x="0" y="0" width="900" height="620" rx="12" fill="#F3F0FA"/>

  <!-- フレーム全体のラベル -->
  <text x="40" y="40" font-size="15" font-weight="bold" fill="#3B3355">task-list（Desktop 1440×1024）</text>
  <text x="330" y="40" font-size="13" fill="#7C3AED">縦Auto Layout・gap 0</text>

  <!-- header内の要素ラベル（フレームの上に出す） -->
  <text x="52" y="76" font-size="12" fill="#7C3AED">app-title</text>
  <path d="M 76 82 V 100" stroke="#C9C2DE" stroke-width="1"/>
  <text x="560" y="76" font-size="12" fill="#7C3AED">user-icon 32×32</text>
  <path d="M 652 82 V 97" stroke="#C9C2DE" stroke-width="1"/>

  <!-- 画面フレーム（1440×1024を0.4375倍で表現） -->
  <rect x="40" y="90" width="630" height="448" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- header（高さ64 → 28） -->
  <line x1="40" y1="118" x2="670" y2="118" stroke="#E2DDF0" stroke-width="1"/>
  <text x="51" y="109" font-size="11" font-weight="bold" fill="#1A1A1F">My Tasks</text>
  <circle cx="652" cy="104" r="7" fill="#D9D9E0"/>

  <!-- content（薄グレー #F5F5F5） -->
  <rect x="41" y="118" width="628" height="419" fill="#F5F5F5"/>
  <!-- page-title -->
  <text x="54" y="145" font-size="13" font-weight="bold" fill="#1A1A1F">今日のタスク</text>
  <!-- プレースホルダー3つ（高さ72 → 32、gap 16 → 7） -->
  <rect x="54" y="156" width="602" height="32" rx="4" fill="#FFFFFF"/>
  <rect x="54" y="195" width="602" height="32" rx="4" fill="#FFFFFF"/>
  <rect x="54" y="234" width="602" height="32" rx="4" fill="#FFFFFF"/>

  <!-- 右側の注記 -->
  <!-- header -->
  <path d="M 674 104 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="100" font-size="13" font-weight="bold" fill="#3B3355">header</text>
  <text x="706" y="117" font-size="12" fill="#5A5273">幅Fill・高さFixed 64</text>
  <text x="706" y="133" font-size="12" fill="#5A5273">横Auto Layout・間隔Auto</text>
  <text x="706" y="149" font-size="12" fill="#5A5273">左右padding 24・上下中央</text>

  <!-- page-title -->
  <path d="M 136 141 H 400 M 400 141 V 180 H 700" stroke="#C9C2DE" stroke-width="1" fill="none"/>
  <text x="706" y="177" font-size="13" font-weight="bold" fill="#3B3355">page-title</text>
  <text x="706" y="194" font-size="12" fill="#5A5273">「今日のタスク」24px Bold</text>

  <!-- placeholder -->
  <path d="M 660 250 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="242" font-size="13" font-weight="bold" fill="#3B3355">placeholder ×3</text>
  <text x="706" y="259" font-size="12" fill="#5A5273">白・角丸8・高さ72・幅Fill</text>
  <text x="706" y="275" font-size="12" fill="#5A5273">（タスクカードは4-2で作る）</text>

  <!-- content -->
  <path d="M 670 370 H 700" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="706" y="366" font-size="13" font-weight="bold" fill="#3B3355">content</text>
  <text x="706" y="383" font-size="12" fill="#5A5273">幅Fill・高さFill</text>
  <text x="706" y="399" font-size="12" fill="#5A5273">縦Auto Layout・gap 16</text>
  <text x="706" y="415" font-size="12" fill="#5A5273">padding 32・背景 #F5F5F5</text>

  <!-- 下部の構造注記 -->
  <text x="40" y="572" font-size="13" fill="#5A5273">レイヤー構造: task-list の中に header と content。header の中に app-title と user-icon、</text>
  <text x="40" y="593" font-size="13" fill="#5A5273">content の中に page-title とプレースホルダー。headerは高さ固定、contentが残りをFillで埋める。</text>
</svg>
