<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="task-listとtask-formの2画面をキャンバスに横並びで配置した俯瞰図。左に一覧画面、右にフォーム画面。どちらも同じヘッダー、同じ背景色、同じテキストスタイルで揃っており、下部にチェックポイントの凡例が並ぶ。">
  <!-- 背景 -->
  <rect x="0" y="0" width="960" height="560" rx="12" fill="#F3F0FA"/>

  <!-- タイトル -->
  <text x="32" y="38" font-size="15" font-weight="bold" fill="#3B3355">キャンバスに2画面を並べて一貫性チェック</text>
  <text x="360" y="38" font-size="12" fill="#7C3AED">Shift + 1 で全体表示</text>

  <!-- ===== 左画面: task-list ===== -->
  <text x="32" y="66" font-size="12" font-weight="bold" fill="#7C3AED">task-list</text>
  <rect x="32" y="76" width="420" height="336" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- header -->
  <line x1="32" y1="104" x2="452" y2="104" stroke="#E2DDF0" stroke-width="1"/>
  <text x="43" y="95" font-size="11" font-weight="bold" fill="#1A1A1F">My Tasks</text>
  <circle cx="434" cy="90" r="7" fill="#EDE7FA" stroke="#C9BEE8" stroke-width="1"/>

  <!-- content -->
  <rect x="33" y="104" width="418" height="307" fill="#F5F5F5"/>
  <text x="46" y="132" font-size="13" font-weight="bold" fill="#1A1A1F">今日のタスク</text>

  <!-- カード1 -->
  <rect x="46" y="146" width="392" height="26" rx="8" fill="#FFFFFF"/>
  <circle cx="62" cy="159" r="5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="76" y="163" font-size="10" fill="#2A2A31">デザインレビューの準備</text>
  <text x="426" y="162" font-size="9" fill="#8A8A93" text-anchor="end">7/3</text>
  <!-- カード2 -->
  <rect x="46" y="178" width="392" height="26" rx="8" fill="#FFFFFF"/>
  <circle cx="62" cy="191" r="5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="76" y="195" font-size="10" fill="#2A2A31">会議資料の作成</text>
  <text x="426" y="194" font-size="9" fill="#8A8A93" text-anchor="end">7/4</text>
  <!-- カード3 -->
  <rect x="46" y="210" width="392" height="26" rx="8" fill="#FFFFFF"/>
  <circle cx="62" cy="223" r="5" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.2"/>
  <text x="76" y="227" font-size="10" fill="#2A2A31">APIエラーの調査</text>
  <text x="426" y="226" font-size="9" fill="#8A8A93" text-anchor="end">7/5</text>
  <!-- カード4（完了） -->
  <rect x="46" y="242" width="392" height="26" rx="8" fill="#FFFFFF"/>
  <circle cx="62" cy="255" r="5" fill="#7C3AED"/>
  <path d="M 59.5 255 L 61.3 257 L 64.5 253" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="259" font-size="10" fill="#A8A8B0">リリースノートの下書き</text>
  <line x1="76" y1="256" x2="160" y2="256" stroke="#A8A8B0" stroke-width="0.8"/>
  <text x="426" y="258" font-size="9" fill="#B5B5BC" text-anchor="end">7/2</text>

  <!-- ===== 右画面: task-form ===== -->
  <text x="492" y="66" font-size="12" font-weight="bold" fill="#7C3AED">task-form</text>
  <rect x="492" y="76" width="420" height="336" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- header -->
  <line x1="492" y1="104" x2="912" y2="104" stroke="#E2DDF0" stroke-width="1"/>
  <text x="503" y="95" font-size="11" font-weight="bold" fill="#1A1A1F">My Tasks</text>
  <circle cx="894" cy="90" r="7" fill="#EDE7FA" stroke="#C9BEE8" stroke-width="1"/>

  <!-- content -->
  <rect x="493" y="104" width="418" height="307" fill="#F5F5F5"/>

  <!-- form-card 中央寄せ -->
  <rect x="618" y="128" width="168" height="252" rx="6" fill="#FFFFFF" stroke="#E2DDF0" stroke-width="1"/>
  <text x="632" y="152" font-size="12" font-weight="bold" fill="#1A1A1F">新しいタスク</text>

  <!-- TextField 1 -->
  <text x="632" y="176" font-size="9" fill="#8A8A93">タスク名</text>
  <rect x="632" y="180" width="140" height="20" rx="4" fill="#FFFFFF" stroke="#D9D9E0" stroke-width="1"/>
  <!-- TextField 2 -->
  <text x="632" y="216" font-size="9" fill="#8A8A93">期限</text>
  <rect x="632" y="220" width="140" height="20" rx="4" fill="#FFFFFF" stroke="#D9D9E0" stroke-width="1"/>
  <!-- TextField 3 -->
  <text x="632" y="256" font-size="9" fill="#8A8A93">メモ</text>
  <rect x="632" y="260" width="140" height="20" rx="4" fill="#FFFFFF" stroke="#D9D9E0" stroke-width="1"/>
  <!-- Button primary -->
  <rect x="632" y="298" width="140" height="22" rx="4" fill="#7C3AED"/>
  <text x="702" y="312" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">登録</text>

  <!-- ===== 揃っていることを示すガイド線 ===== -->
  <!-- ヘッダー高さの水平線 -->
  <line x1="20" y1="104" x2="940" y2="104" stroke="#7C3AED" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.55"/>
  <text x="20" y="99" font-size="9" fill="#7C3AED">ヘッダー高さ64</text>

  <!-- app-title の縦位置 -->
  <line x1="20" y1="90" x2="940" y2="90" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- ===== チェックポイント凡例 ===== -->
  <text x="32" y="446" font-size="13" font-weight="bold" fill="#3B3355">一貫性のチェックポイント</text>

  <!-- 4項目のグリッド -->
  <g font-size="11" fill="#5A5273">
    <!-- 1: ヘッダー -->
    <rect x="32" y="458" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
    <text x="52" y="469" font-weight="bold" fill="#3B3355">ヘッダー</text>
    <text x="52" y="484">高さ64・背景surface・app-titleの位置</text>

    <!-- 2: 色 -->
    <rect x="270" y="458" width="14" height="14" rx="3" fill="#F5F5F5" stroke="#C9C2DE" stroke-width="1"/>
    <text x="290" y="469" font-weight="bold" fill="#3B3355">色</text>
    <text x="290" y="484">bg・surface・brandをスタイルから当てる</text>

    <!-- 3: タイポ -->
    <text x="508" y="470" font-size="14" font-weight="bold" fill="#3B3355">Aa</text>
    <text x="530" y="469" font-weight="bold" fill="#3B3355">タイポ</text>
    <text x="530" y="484">page-title・card-title・label のサイズ</text>

    <!-- 4: 余白・角丸 -->
    <rect x="746" y="458" width="14" height="14" rx="4" fill="#EDE7FA" stroke="#7C3AED" stroke-width="1"/>
    <text x="766" y="469" font-weight="bold" fill="#3B3355">余白・角丸</text>
    <text x="766" y="484">padding 32 / gap 20 / 角丸12 で統一</text>
  </g>

  <!-- 下部の締めコピー -->
  <text x="32" y="524" font-size="12" fill="#5A5273">2画面を並べて左右で見比べると、ズレは目で気づける。目視で見つけて既存スタイルの再適用や数値の統一で直す。</text>
  <text x="32" y="542" font-size="12" fill="#5A5273">レイヤー名を規約どおりに整えれば、6章のFigma MCPでのコード生成にそのまま渡せる状態になる。</text>
</svg>
