<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="2日間のハンズオンの流れの俯瞰図。1章から6章までを左から右に並べ、1章から3章は基礎の練習、4章と5章で本番の2画面を作り、6章でコード生成まで進む積み上がりを示す。">
  <!-- 背景 -->
  <rect x="0" y="0" width="960" height="380" rx="12" fill="#F3F0FA"/>

  <!-- タイトル -->
  <text x="32" y="38" font-size="15" font-weight="bold" fill="#3B3355">2日間の積み上がり</text>
  <text x="32" y="58" font-size="12" fill="#5A5273">基礎の練習 → 本番の2画面 → コード生成、の順で積み上げた流れ</text>

  <!-- Day1 / Day2 のラベル帯 -->
  <rect x="32" y="80" width="580" height="22" rx="4" fill="#EDE7FA"/>
  <text x="42" y="96" font-size="11" font-weight="bold" fill="#7C3AED">Day 1</text>
  <rect x="620" y="80" width="308" height="22" rx="4" fill="#DFF4E9"/>
  <text x="630" y="96" font-size="11" font-weight="bold" fill="#0F7A4A">Day 2</text>

  <!-- ===== 6つの章ボックス ===== -->
  <!-- 1章 -->
  <g>
    <rect x="32" y="118" width="140" height="178" rx="8" fill="#FFFFFF" stroke="#C9BEE8" stroke-width="1.2"/>
    <text x="46" y="140" font-size="12" font-weight="bold" fill="#7C3AED">1章</text>
    <text x="46" y="158" font-size="11" font-weight="bold" fill="#1A1A1F">Figmaを開く</text>
    <line x1="46" y1="168" x2="158" y2="168" stroke="#E2DDF0" stroke-width="1"/>
    <text x="46" y="188" font-size="10" fill="#3B3355">画面構成</text>
    <text x="46" y="206" font-size="10" fill="#3B3355">フレーム作成</text>
    <text x="46" y="224" font-size="10" fill="#3B3355">ズーム・パン</text>
    <text x="46" y="278" font-size="9" fill="#8A8A93">操作に慣れる</text>
  </g>

  <!-- 2章 -->
  <g>
    <rect x="178" y="118" width="140" height="178" rx="8" fill="#FFFFFF" stroke="#C9BEE8" stroke-width="1.2"/>
    <text x="192" y="140" font-size="12" font-weight="bold" fill="#7C3AED">2章</text>
    <text x="192" y="158" font-size="11" font-weight="bold" fill="#1A1A1F">基本要素</text>
    <line x1="192" y1="168" x2="304" y2="168" stroke="#E2DDF0" stroke-width="1"/>
    <text x="192" y="188" font-size="10" fill="#3B3355">シェイプ・文字</text>
    <text x="192" y="206" font-size="10" fill="#3B3355">Auto Layout</text>
    <text x="192" y="224" font-size="10" fill="#3B3355">Hug / Fill</text>
    <text x="192" y="278" font-size="9" fill="#8A8A93">サンプルで練習</text>
  </g>

  <!-- 3章 -->
  <g>
    <rect x="324" y="118" width="140" height="178" rx="8" fill="#FFFFFF" stroke="#C9BEE8" stroke-width="1.2"/>
    <text x="338" y="140" font-size="12" font-weight="bold" fill="#7C3AED">3章</text>
    <text x="338" y="158" font-size="11" font-weight="bold" fill="#1A1A1F">基礎知識</text>
    <line x1="338" y1="168" x2="450" y2="168" stroke="#E2DDF0" stroke-width="1"/>
    <text x="338" y="188" font-size="10" fill="#3B3355">スタイル</text>
    <text x="338" y="206" font-size="10" fill="#3B3355">コンポーネント</text>
    <text x="338" y="224" font-size="10" fill="#3B3355">レイヤー命名</text>
    <text x="338" y="278" font-size="9" fill="#8A8A93">再利用の作法</text>
  </g>

  <!-- 4章 -->
  <g>
    <rect x="470" y="118" width="140" height="178" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="470" y="118" width="140" height="24" rx="8" fill="#7C3AED"/>
    <text x="484" y="135" font-size="11" font-weight="bold" fill="#FFFFFF">4章 本番</text>
    <text x="484" y="160" font-size="11" font-weight="bold" fill="#1A1A1F">タスク一覧</text>
    <line x1="484" y1="170" x2="596" y2="170" stroke="#E2DDF0" stroke-width="1"/>
    <text x="484" y="190" font-size="10" fill="#3B3355">骨組み</text>
    <text x="484" y="208" font-size="10" fill="#3B3355">TaskCard</text>
    <text x="484" y="226" font-size="10" fill="#3B3355">色・タイポ仕上げ</text>
    <text x="484" y="278" font-size="9" fill="#8A8A93">ゼロから1画面</text>
  </g>

  <!-- 5章 -->
  <g>
    <rect x="620" y="118" width="140" height="178" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="620" y="118" width="140" height="24" rx="8" fill="#7C3AED"/>
    <text x="634" y="135" font-size="11" font-weight="bold" fill="#FFFFFF">5章 本番</text>
    <text x="634" y="160" font-size="11" font-weight="bold" fill="#1A1A1F">登録フォーム</text>
    <line x1="634" y1="170" x2="746" y2="170" stroke="#E2DDF0" stroke-width="1"/>
    <text x="634" y="190" font-size="10" fill="#3B3355">フォーム骨組み</text>
    <text x="634" y="208" font-size="10" fill="#3B3355">TextField / Button</text>
    <text x="634" y="226" font-size="10" fill="#3B3355">2画面の一貫性</text>
    <text x="634" y="278" font-size="9" fill="#8A8A93">同じ手順で2画面目</text>
  </g>

  <!-- 6章 -->
  <g>
    <rect x="770" y="118" width="158" height="178" rx="8" fill="#FFFFFF" stroke="#0F7A4A" stroke-width="1.5"/>
    <rect x="770" y="118" width="158" height="24" rx="8" fill="#0F7A4A"/>
    <text x="784" y="135" font-size="11" font-weight="bold" fill="#FFFFFF">6章 コード化</text>
    <text x="784" y="160" font-size="11" font-weight="bold" fill="#1A1A1F">Figma MCP</text>
    <line x1="784" y1="170" x2="914" y2="170" stroke="#E2DDF0" stroke-width="1"/>
    <text x="784" y="190" font-size="10" fill="#3B3355">MCPセットアップ</text>
    <text x="784" y="208" font-size="10" fill="#3B3355">一覧をコード生成</text>
    <text x="784" y="226" font-size="10" fill="#3B3355">フォームをコード生成</text>
    <text x="784" y="278" font-size="9" fill="#8A8A93">Claude Codeへ渡す</text>
  </g>

  <!-- 矢印 -->
  <g stroke="#7C3AED" stroke-width="1.6" fill="none">
    <path d="M 172 210 L 178 210"/>
    <path d="M 318 210 L 324 210"/>
    <path d="M 464 210 L 470 210"/>
    <path d="M 610 210 L 620 210"/>
  </g>
  <path d="M 760 210 L 770 210" stroke="#0F7A4A" stroke-width="1.6" fill="none"/>

  <!-- 積み上がりの説明帯 -->
  <text x="32" y="326" font-size="12" font-weight="bold" fill="#3B3355">積み上がりのポイント</text>
  <text x="32" y="346" font-size="11" fill="#5A5273">1〜3章の練習で覚えた手順（Auto Layout・スタイル・コンポーネント・命名）を、4〜5章で本番の2画面にそのまま当てはめる。</text>
  <text x="32" y="364" font-size="11" fill="#5A5273">整えたレイヤー名とコンポーネントが、6章のFigma MCP + Claude Codeでコードの品質にそのまま出る。</text>
</svg>
