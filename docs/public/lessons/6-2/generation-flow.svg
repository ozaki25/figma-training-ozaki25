<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="Figma MCPからコード生成までの流れ図。Figmaのtask-listデザインをClaude Codeに読み取らせ、get_design_contextでフレーム構造とスタイルを取得し、Claude CodeがReact + Tailwind CSSのコード（TaskList.tsxとTaskCard.tsx）を生成する。">
  <!-- 背景 -->
  <rect x="0" y="0" width="860" height="340" rx="12" fill="#F3F0FA"/>

  <!-- 1. Figmaデザイン -->
  <rect x="30" y="90" width="180" height="160" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1"/>
  <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3355">1. Figmaデザイン</text>
  <text x="120" y="115" text-anchor="middle" font-size="11" font-family="monospace" fill="#7C3AED">task-list</text>
  <rect x="50" y="128" width="140" height="26" rx="4" fill="#F5F5F5"/>
  <text x="60" y="145" font-size="10" font-family="monospace" fill="#3B3355">header</text>
  <rect x="50" y="160" width="140" height="70" rx="4" fill="#F5F5F5"/>
  <text x="60" y="176" font-size="10" font-family="monospace" fill="#3B3355">content</text>
  <rect x="58" y="184" width="124" height="14" rx="3" fill="#FFFFFF" stroke="#C9C2DE"/>
  <text x="66" y="195" font-size="9" font-family="monospace" fill="#5A5273">TaskCard</text>
  <rect x="58" y="202" width="124" height="14" rx="3" fill="#FFFFFF" stroke="#C9C2DE"/>
  <text x="66" y="213" font-size="9" font-family="monospace" fill="#5A5273">TaskCard</text>

  <!-- 2. MCP -->
  <rect x="260" y="90" width="180" height="160" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="350" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3355">2. Figma MCP</text>
  <text x="350" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C3AED">get_design_context</text>
  <text x="350" y="175" text-anchor="middle" font-size="10" fill="#5A5273">構造・Auto Layout</text>
  <text x="350" y="192" text-anchor="middle" font-size="10" fill="#5A5273">スタイル・レイヤー名</text>
  <text x="350" y="209" text-anchor="middle" font-size="10" fill="#5A5273">を構造化データで受け渡す</text>

  <!-- 3. Claude Code -->
  <rect x="490" y="90" width="180" height="160" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1"/>
  <text x="580" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3355">3. Claude Code</text>
  <rect x="505" y="110" width="150" height="130" rx="6" fill="#1B1B1F"/>
  <text x="515" y="132" font-size="10" font-family="monospace" fill="#5EDDA8">$ claude</text>
  <text x="515" y="152" font-size="10" font-family="monospace" fill="#C4A5FF">&gt; このURLを</text>
  <text x="515" y="168" font-size="10" font-family="monospace" fill="#C4A5FF">  React+Tailwindで</text>
  <text x="515" y="184" font-size="10" font-family="monospace" fill="#C4A5FF">  実装して</text>
  <text x="515" y="208" font-size="10" font-family="monospace" fill="#FFFFFF">生成中...</text>
  <text x="515" y="228" font-size="10" font-family="monospace" fill="#5EDDA8">✓ files written</text>

  <!-- 4. 生成コード -->
  <rect x="720" y="90" width="120" height="160" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1"/>
  <text x="780" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3355">4. 生成コード</text>
  <rect x="732" y="105" width="96" height="26" rx="4" fill="#F5F5F5"/>
  <text x="740" y="122" font-size="10" font-family="monospace" fill="#3B3355">TaskList.tsx</text>
  <rect x="732" y="137" width="96" height="26" rx="4" fill="#F5F5F5"/>
  <text x="740" y="154" font-size="10" font-family="monospace" fill="#3B3355">TaskCard.tsx</text>
  <text x="780" y="185" text-anchor="middle" font-size="10" fill="#5A5273">React</text>
  <text x="780" y="202" text-anchor="middle" font-size="10" fill="#5A5273">+ Tailwind CSS</text>

  <!-- 矢印 -->
  <line x1="218" y1="170" x2="250" y2="170" stroke="#7C3AED" stroke-width="2.5"/>
  <path d="M 252 170 l -10 -6 v 12 z" fill="#7C3AED"/>
  <line x1="448" y1="170" x2="480" y2="170" stroke="#7C3AED" stroke-width="2.5"/>
  <path d="M 482 170 l -10 -6 v 12 z" fill="#7C3AED"/>
  <line x1="678" y1="170" x2="710" y2="170" stroke="#7C3AED" stroke-width="2.5"/>
  <path d="M 712 170 l -10 -6 v 12 z" fill="#7C3AED"/>

  <text x="430" y="300" text-anchor="middle" font-size="13" fill="#3B3355">Figmaのデザインを読み取り、指示に沿ってReact + Tailwind CSSのコードに変換する</text>
</svg>
