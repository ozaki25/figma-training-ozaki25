<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="メインコンポーネントとインスタンスの関係。原本のButtonから3つのインスタンスが作られ、うち2つはラベルを上書きしている。原本を変更すると全インスタンスに反映される。">
  <!-- 背景（ライト/ダーク両モードで同じ見た目になるよう単色を持たせる） -->
  <rect x="0" y="0" width="860" height="400" rx="12" fill="#F3F0FA"/>

  <!-- 左: メインコンポーネント -->
  <text x="190" y="50" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">メインコンポーネント（原本）</text>

  <!-- ひし形4つのアイコン -->
  <g fill="#7C3AED">
    <path d="M 70 186 l 6 6 l -6 6 l -6 -6 z"/>
    <path d="M 84 186 l 6 6 l -6 6 l -6 -6 z"/>
    <path d="M 70 200 l 6 6 l -6 6 l -6 -6 z"/>
    <path d="M 84 200 l 6 6 l -6 6 l -6 -6 z"/>
  </g>
  <text x="98" y="204" font-size="13" fill="#7C3AED" font-weight="bold">Button</text>

  <rect x="60" y="216" width="180" height="48" rx="8" fill="#7C3AED" stroke="#5B21B6" stroke-width="2"/>
  <text x="150" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">保存する</text>

  <text x="190" y="320" text-anchor="middle" font-size="13" fill="#5A5273">編集するのはここだけ。</text>
  <text x="190" y="342" text-anchor="middle" font-size="13" fill="#5A5273">変更は全インスタンスに反映される</text>

  <!-- 対応線（原本 → 各インスタンス） -->
  <path d="M 244 240 C 340 240, 400 120, 500 120" stroke="#7C3AED" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <path d="M 244 240 C 340 240, 400 240, 500 240" stroke="#7C3AED" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <path d="M 244 240 C 340 240, 400 320, 500 320" stroke="#7C3AED" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>

  <!-- 右: インスタンス -->
  <text x="650" y="50" text-anchor="middle" font-size="17" font-weight="bold" fill="#3B3355">インスタンス（複製）</text>

  <!-- インスタンス1 -->
  <g fill="none" stroke="#7C3AED" stroke-width="1.5">
    <path d="M 520 84 l 6 6 l -6 6 l -6 -6 z"/>
  </g>
  <rect x="510" y="100" width="180" height="42" rx="8" fill="#7C3AED"/>
  <text x="600" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">保存する</text>

  <!-- インスタンス2（上書きあり） -->
  <g fill="none" stroke="#7C3AED" stroke-width="1.5">
    <path d="M 520 204 l 6 6 l -6 6 l -6 -6 z"/>
  </g>
  <rect x="510" y="220" width="180" height="42" rx="8" fill="#7C3AED"/>
  <text x="600" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">送信する</text>
  <text x="704" y="246" font-size="11" fill="#7C3AED">ラベルを上書き</text>

  <!-- インスタンス3（上書きあり） -->
  <g fill="none" stroke="#7C3AED" stroke-width="1.5">
    <path d="M 520 284 l 6 6 l -6 6 l -6 -6 z"/>
  </g>
  <rect x="510" y="300" width="180" height="42" rx="8" fill="#7C3AED"/>
  <text x="600" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">申し込む</text>
  <text x="704" y="326" font-size="11" fill="#7C3AED">ラベルを上書き</text>

  <text x="650" y="380" text-anchor="middle" font-size="13" fill="#5A5273">テキストや色はインスタンスごとに上書きできる</text>
</svg>
